<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Login | nb-theme-9</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Meta descriptions may be included in search results to concisely summarize page content.">
    <link rel="shortcut icon" href="images/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="css/main.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="images/login-top-right-shape.svg" alt="Shape" class="shape right-shape" />
            <img src="images/login-top-left-shape.svg" alt="Shape" class="shape left-shape" />
            <div class="login-banner" data-aos="zoom-in">
                <img src="images/login-banner.svg" alt="Banner" />
            </div>
            <div class="login-form">
                <a href="#" title="HexaDash" class="login-logo" data-aos="zoom-in">
                    <img src="images/login-logo.svg" alt="HexaDash" />
                </a>
                <h4 data-aos="zoom-in" data-aos-delay="100">Welcome to Hexadash!</h4>
                <p class="sub-info" data-aos="zoom-in" data-aos-delay="200">
                    Please sign in to your account
                </p>
                <div class="form-group mb-3 pb-1" data-aos="fade-up" data-aos-delay="300">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Email" />
                </div>
                <div class="form-group" data-aos="fade-up" data-aos-delay="400">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" autocomplete="new-password" class="form-control password-input"
                            id="password" placeholder="Password" data-placeholder="Password">
                        <button type="button" class="btn icon-btn password-btn">
                            <img src="images/hide-password-icon.svg" alt="Hide Password" class="hide-password">
                            <img src="images/show-password-icon.svg" alt="Show Password" class="show-password">
                        </button>
                    </div>
                </div>
                <div class="action-wrapper" data-aos="fade-up" data-aos-delay="500">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="rememberme" checked />
                        <label class="form-check-label" for="rememberme">
                            Remember me
                        </label>
                    </div>
                    <a href="#" title="Forgot Password?" class="primary-link">
                        Forgot Password?
                    </a>
                </div>
                <a href="dashboard.html" role="button" class="btn btn-primary w-100" data-aos="fade-up"
                    data-aos-delay="600">
                    <span>Sign In</span>
                </a>
                <p class="sign-up-text pb-0" data-aos="fade-up" data-aos-delay="700">
                    Don't have an account?
                    <a href="#" title="Sign Up" class="primary-link">Sign Up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- JavaScripts -->
    <script src="js/main.js"></script>
</body>

</html>
